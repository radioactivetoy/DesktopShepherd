[package]
name = "desktopshepherd"
version = "1.0.0-rc.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A lightweight desktop icon organizer: boxes (fences) on your desktop, plus widgets."

[[bin]]
name = "desktopshepherd"
path = "src/main.rs"

[dependencies]
egui = { version = "0.31", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
blowfish = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Storage_Xps",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Foundation_Numerics",
    "System",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinHttp",
    "Win32_NetworkManagement",
    "Win32_NetworkManagement_WiFi",
    "Win32_Devices",
    "Win32_Devices_Bluetooth",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_Globalization",
    "Win32_System_Diagnostics_Debug",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage",
    "Storage_Streams",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_Ime",
    "Win32_Security",
    "Win32_Security_Cryptography",
] }

[profile.dev]
# Full speed even in everyday builds: the app must never slow anything down.
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The installer's build (scripts\make-setup.ps1): like everyday builds, without the debugging
# information that makes the file ~10x bigger.
[profile.dist]
inherits = "dev"
debug = false
strip = true
incremental = false
